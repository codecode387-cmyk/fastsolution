<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Lush · Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--purple:#462986;--purple-d:#2d1a5e;--purple-dd:#1d1040;--gold:#c9a24b;--gold-l:#e6c97c;--cream:#faf7f1;--ink:#1e1535;--muted:#5d5675;--line:#e8e2f2;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,-apple-system,Segoe UI,sans-serif;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
    img{max-width:100%;display:block}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1180px;margin:0 auto;padding:0 1.25rem;width:100%}
    header.nav{background:rgba(45,26,94,.96);backdrop-filter:blur(10px);border-bottom:1px solid rgba(230,201,124,.18);padding:.6rem 0;position:sticky;top:0;z-index:50}
    .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
    .nav img.logo{height:56px;width:auto}
    .nav nav{display:flex;gap:1.6rem;align-items:center}
    .nav nav a{color:#e9e3f7;font-size:.88rem;letter-spacing:.06em;transition:color .2s}
    .nav nav a:hover{color:var(--gold-l)}
    .nav .btn{display:inline-flex;align-items:center;justify-content:center;padding:.7rem 1.2rem;border-radius:999px;font:500 .72rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;border:1.5px solid rgba(230,201,124,.7);cursor:pointer;transition:transform .2s,background .2s;background:transparent;color:#fff}
    .nav .btn:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}

    .hero{background:radial-gradient(900px 500px at 75% 40%,#6a45c2 0%,transparent 60%),linear-gradient(160deg,var(--purple) 0%,var(--purple-dd) 100%);color:#fff;padding:3.5rem 0 3rem;text-align:center}
    .hero .eyebrow{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-l);font-weight:500;margin-bottom:.9rem}
    .hero h1{font-family:var(--serif);font-size:clamp(2.4rem,5vw,3.6rem);font-weight:600;line-height:1.1;margin-bottom:.8rem}
    .hero h1 em{color:var(--gold-l);font-style:italic}
    .hero p{color:#dcd4f0;max-width:36rem;margin:0 auto;font-size:1.05rem}

    .main{padding:3rem 0 4rem;flex:1}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6rem}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.grid{grid-template-columns:1fr}}

    .post{background:#fff;border-radius:22px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s;cursor:pointer}
    .post:hover{transform:translateY(-5px);box-shadow:0 22px 44px -24px rgba(45,26,94,.5)}
    .post .cover{aspect-ratio:16/9;background:#f2eefa;overflow:hidden}
    .post .cover img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
    .post:hover .cover img{transform:scale(1.05)}
    .post .body{padding:1.5rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
    .post .meta{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:500}
    .post h2{font-family:var(--serif);font-size:1.6rem;color:var(--purple-d);font-weight:600;line-height:1.2}
    .post p{color:var(--muted);font-size:.95rem;flex:1}
    .post .more{color:var(--purple);font-size:.85rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-top:.5rem}

    .empty{text-align:center;padding:4rem 1rem;color:var(--muted)}
    .empty b{display:block;font-family:var(--serif);font-size:1.8rem;color:var(--purple-d);margin-bottom:.5rem}

    .loading{text-align:center;padding:4rem 1rem;color:var(--muted)}
    .spinner{display:inline-block;width:32px;height:32px;border:3px solid rgba(70,41,134,.2);border-radius:50%;border-top-color:var(--purple);animation:spin .8s linear infinite;margin-bottom:1rem}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Modal for full post */
    .modal{position:fixed;inset:0;background:rgba(29,16,64,.85);display:none;align-items:flex-start;justify-content:center;padding:2rem 1rem;z-index:100;overflow-y:auto}
    .modal.show{display:flex}
    .modal-inner{background:#fff;border-radius:22px;max-width:760px;width:100%;padding:2.5rem 2.2rem;position:relative;margin:auto}
    .modal-inner .close{position:absolute;top:1rem;right:1rem;background:var(--cream);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.2rem;color:var(--purple-d)}
    .modal-inner .close:hover{background:var(--line)}
    .modal-inner img.cover{width:100%;border-radius:14px;margin-bottom:1.4rem;max-height:380px;object-fit:cover}
    .modal-inner .meta{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:.6rem}
    .modal-inner h1{font-family:var(--serif);font-size:2.2rem;color:var(--purple-d);font-weight:600;line-height:1.15;margin-bottom:1rem}
    .modal-inner .content{color:var(--ink);font-size:1.02rem;line-height:1.75;white-space:pre-wrap;word-wrap:break-word}

    .micro-footer{text-align:center;padding:1.8rem .5rem 1.2rem;font-size:.75rem;color:#9d92bf;letter-spacing:.04em}
    @media(max-width:640px){.nav nav a:not(.btn){display:none}.nav .wrap{height:58px}.nav img.logo{height:44px}.modal-inner{padding:1.8rem 1.4rem}.modal-inner h1{font-size:1.7rem}}
  </style>
</head>
<body>

  <header class="nav">
    <div class="wrap">
      <a href="GlobalLush.html"><img class="logo" src="images/logo-gold.png" alt="Global Lush logo" /></a>
      <nav>
        <a href="GlobalLush.html">Home</a>
        <a href="store.html">Store</a>
        <a href="blog.html">Blog</a>
        <a class="btn" href="log.html">Log in</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">Journal</p>
      <h1>The <em>Global Lush</em> Blog</h1>
      <p>Skin stories, routines, and ingredient guides from our team.</p>
    </div>
  </section>

  <main class="main">
    <div class="wrap">
      <div id="loadingState" class="loading"><div class="spinner"></div><div>Loading posts…</div></div>
      <div id="emptyState" class="empty" style="display:none"><b>No posts yet</b><p>Our first article is on the way.</p></div>
      <div id="postGrid" class="grid"></div>
    </div>
  </main>

  <div class="modal" id="postModal">
    <div class="modal-inner">
      <button class="close" id="closeModal">✕</button>
      <img class="cover" id="mCover" src="" alt=""/>
      <div class="meta" id="mMeta"></div>
      <h1 id="mTitle"></h1>
      <div class="content" id="mContent"></div>
    </div>
  </div>

  <div class="micro-footer">© 2026 Global Lush · For external use only · Keep out of reach of children</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function(){
      'use strict';
      const SUPABASE_URL='https://wfqoezxisgfiiktcrajq.supabase.co';
      const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcW9lenhpc2dmaWlrdGNyYWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNDk3ODksImV4cCI6MjEwNzcyNTc4OX0.WfflwzSNY3zjqwihaQjM9pqdIXTczdZVTh7rjndvSPw';
      const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});

      // visitor tracking
      (function(){
        let vid=localStorage.getItem('gl_visitor_id');
        if(!vid){vid='v_'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('gl_visitor_id',vid);}
        sb.from('page_visits').insert([{page:'blog.html',visitor_id:vid,user_agent:navigator.userAgent.slice(0,200)}]).then(function(){}).catch(function(){});
      })();

      function esc(s){return s==null?'':String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
      function fmtDate(d){if(!d)return'';try{return new Date(d).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});}catch(e){return'';}}

      const grid=document.getElementById('postGrid');
      const loadingEl=document.getElementById('loadingState');
      const emptyEl=document.getElementById('emptyState');
      let allPosts=[];

      function render(list){
        loadingEl.style.display='none';
        allPosts=list;
        if(!list.length){emptyEl.style.display='block';grid.innerHTML='';return;}
        emptyEl.style.display='none';
        grid.innerHTML=list.map(function(p,i){
          const cover=p.cover_image||'images/og-global-lush.jpg';
          return `
            <article class="post" data-i="${i}">
              <div class="cover"><img src="${esc(cover)}" alt="${esc(p.title)}" loading="lazy" onerror="this.src='images/p-strawberry.jpg'"/></div>
              <div class="body">
                <div class="meta">${fmtDate(p.created_at)} · ${esc(p.author||'Global Lush')}</div>
                <h2>${esc(p.title)}</h2>
                <p>${esc(p.excerpt||'')}</p>
                <div class="more">Read more →</div>
              </div>
            </article>
          `;
        }).join('');
        grid.querySelectorAll('.post').forEach(function(el){
          el.addEventListener('click',function(){openPost(Number(el.dataset.i));});
        });
      }

      // modal
      const modal=document.getElementById('postModal');
      const mCover=document.getElementById('mCover');
      const mMeta=document.getElementById('mMeta');
      const mTitle=document.getElementById('mTitle');
      const mContent=document.getElementById('mContent');

      function openPost(i){
        const p=allPosts[i];if(!p)return;
        const cover=p.cover_image||'images/og-global-lush.jpg';
        mCover.src=cover;
        mCover.style.display=p.cover_image?'block':'none';
        mMeta.textContent=fmtDate(p.created_at)+' · '+(p.author||'Global Lush');
        mTitle.textContent=p.title||'';
        mContent.textContent=p.content||p.excerpt||'';
        modal.classList.add('show');
        document.body.style.overflow='hidden';
      }
      function closeModal(){modal.classList.remove('show');document.body.style.overflow='';}
      document.getElementById('closeModal').addEventListener('click',closeModal);
      modal.addEventListener('click',function(e){if(e.target===modal)closeModal();});
      document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

      function load(){
        sb.from('blog_posts').select('*').eq('published',true).order('created_at',{ascending:false})
          .then(function(res){
            if(res.error){console.error('Blog error:',res.error);loadingEl.innerHTML='<div style="color:#b33">Could not load posts.</div>';return;}
            render(res.data||[]);
          });
      }
      load();
      sb.channel('blog-live').on('postgres_changes',{event:'*',schema:'public',table:'blog_posts'},load).subscribe();
    })();
  </script>
</body>
</html>
